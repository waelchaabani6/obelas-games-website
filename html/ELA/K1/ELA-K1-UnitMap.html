  <style>
    /* Loading Screen Styles */
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #87CEEB 0%, #4A90E2 50%, #1E5F8C 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.5s ease-out;
    }

    #loading-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .loading-content {
      text-align: center;
      color: white;
    }

    .loading-title {
      font-size: 2.5rem;
      font-weight: bold;
      margin-bottom: 1rem;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
      color: #fff;
    }

    .loading-spinner {
      width: 60px;
      height: 60px;
      border: 6px solid rgba(255, 255, 255, 0.3);
      border-top: 6px solid #FFD700;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 2rem auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading-progress {
      width: 300px;
      height: 10px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 5px;
      overflow: hidden;
      margin: 1rem auto;
      border: 2px solid rgba(255, 255, 255, 0.2);
    }

    .loading-progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #699bf7 0%, #4f86ff 50%, #2563eb 100%);
      width: 0%;
      transition: width 0.3s ease;
      border-radius: 3px;
      box-shadow: 0 0 10px rgba(105, 155, 247, 0.5);
    }

    .loading-text {
      font-size: 1.2rem;
      margin-top: 1rem;
      opacity: 0.95;
      color: #E6F3FF;
      font-weight: 600;
    }

    /* Hide main content until loaded */
    body.loading .container {
      visibility: hidden;
    }

    body.loaded .container {
      visibility: visible;
    }
  </style>
</head>
