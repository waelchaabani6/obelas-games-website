<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>ELA-G1 Garden Adventure - Interactive Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../../../css/ELA/G1/ELA-G1-UnitsMap.css" />
</head>

<body>

<!-- Stylish Loading Screen -->
<div id="loading-screen" class="loading-screen">
  <div class="loading-content">
    <div class="garden-icon">🌻</div>
    <h2 class="loading-title">Growing Your Garden Adventure...</h2>
    <p id="loading-text" class="loading-text">Planting flowers... 0%</p>
    <div class="loading-bar">
      <div class="loading-progress" id="loading-progress"></div>
    </div>
  </div>
</div>

<!-- ✅ One global audio element -->
<audio id="background-music" src="../../../audio/kids-game-gaming-background-music-295075.mp3" loop></audio>

<!-- ✅ Global music toggle (always visible) -->
<button id="music-toggle" class="music-control-btn bottom-right" title="Toggle Music">🔊</button>

  
  <div class="container" class="hidden" >
    <!-- Header Section -->
    <header class="header">
      <div class="header-content">
        <div class="ui-left">
          <a href='../../../html/ELA/ELA-GridGrades.html' class="back-btn" id="back-btn">
            <i class="fas fa-arrow-left"></i>
            <span class="label">Back</span>
          </a>
        </div>
        
        <div class="title-section">
          <h1 class="main-title">ELA Grade 1 Garden Adventure</h1>
        </div>
        
        
      </div>
    </header>

    <!-- Main Map Container -->
    <main class="map-wrapper">
      <div class="map-container">
        <!-- Background Image -->
        <div class="garden-background"></div>
        
        <!-- Garden Tool (instead of rocket) -->
        <div class="garden-tool">
          <i class="fas fa-seedling"></i>
        </div>
        
        
        <!-- Flower Hotspots -->
        <div class="hotspots-container">
          <!-- 5 Garden Units -->
          <button id="hotspot-1" class="hotspot attention" data-flower="1" data-route="../../../html/ELA/G1/U1/ELA-G1-U1.html">
            <div class="hotspot-marker flower-marker">
              <span class="marker-number">1</span>
              <div class="marker-glow"></div>
            </div>
            <span class="hotspot-label">Lavender Garden</span>
            <div class="completion-badge">
              <i class="fas fa-star"></i>
            </div>
          </button>
          
          <button id="hotspot-2" class="hotspot" data-flower="2" data-route="./U2/ELA-G1-U2.html">
            <div class="hotspot-marker flower-marker">
              <span class="marker-number">2</span>
              <div class="marker-glow"></div>
            </div>
            <span class="hotspot-label">Marigold Garden</span>
            <div class="completion-badge">
              <i class="fas fa-star"></i>
            </div>
          </button>
          
          <button id="hotspot-3" class="hotspot" data-flower="3" data-route="./U3/ELA-G1-U3.html">
            <div class="hotspot-marker flower-marker">
              <span class="marker-number">3</span>
              <div class="marker-glow"></div>
            </div>
            <span class="hotspot-label">Rose Garden</span>
            <div class="completion-badge">
              <i class="fas fa-star"></i>
            </div>
          </button>
          
          <button id="hotspot-4" class="hotspot" data-flower="4" data-route="./U4/ELA-G1-U4.html">
            <div class="hotspot-marker flower-marker">
              <span class="marker-number">4</span>
              <div class="marker-glow"></div>
            </div>
            <span class="hotspot-label">Sunflower Garden</span>
            <div class="completion-badge">
              <i class="fas fa-star"></i>
            </div>
          </button>
          
          <button id="hotspot-5" class="hotspot" data-flower="5" data-route="./U5/ELA-G1-U5.html">
            <div class="hotspot-marker flower-marker">
              <span class="marker-number">5</span>
              <div class="marker-glow"></div>
            </div>
            <span class="hotspot-label">Tulip Garden</span>
            <div class="completion-badge">
              <i class="fas fa-star"></i>
            </div>
          </button>
        </div>
        
    
        
        <!-- Interactive Tooltip -->
        <div id="tooltip" class="tooltip">
          <div class="tooltip-content">
            <h3 class="tooltip-title"></h3>
            <p class="tooltip-description"></p>
            <div class="tooltip-arrow"></div>
          </div>
        </div>
      </div>
    </main>
    <script src="../../../js/ELA/G1/ELA-G1-UnitMap.js"></script>
</div>
</body>
</html>
